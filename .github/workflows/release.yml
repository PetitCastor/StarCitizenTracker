name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute next version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v0.*.0' | sed -E 's/^v0\.([0-9]+)\.0$/\1/' | sort -n | tail -1)
          latest=${latest:-0}
          next=$((latest + 1))
          echo "VERSION=v0.$next.0" >> "$GITHUB_ENV"

      # MinVerVersionOverride, because the tag this release is named for does not exist yet: it is
      # created by `gh release create` two steps down. Left to derive its own version, MinVer would
      # see only the PREVIOUS tag and stamp the engine 0.N.1-alpha.0.x — so a release labelled
      # v0.13.0 would ship an exe reporting 0.12.1-alpha.0.7 as its engine_version over the wire.
      # $VERSION already carries the leading v, which MinVerTagPrefix strips.
      - name: Publish GameCapture.Engine
        run: dotnet publish src/GameCapture.Engine -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:MinVerVersionOverride=$($env:VERSION.TrimStart('v')) -o publish/engine

      - name: Archive GameCapture.Engine
        run: Compress-Archive publish/engine/* GameCapture.Engine-${env:VERSION}-win-x64.zip

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:VERSION GameCapture.Engine-*.zip --generate-notes
