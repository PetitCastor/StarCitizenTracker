name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute next version
        shell: bash
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v0.*.0' | sed -E 's/^v0\.([0-9]+)\.0$/\1/' | sort -n | tail -1)
          latest=${latest:-0}
          next=$((latest + 1))
          echo "VERSION=0.$next.0" >> "$GITHUB_ENV"
          echo "TAG=v0.$next.0" >> "$GITHUB_ENV"

      - name: Publish single-file exe
        run: >
          dotnet publish src/TrackingService/TrackingService.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ env.TAG }}"
          "publish/TrackingService.exe"
          --title "${{ env.TAG }}"
          --generate-notes
          --target ${{ github.sha }}
