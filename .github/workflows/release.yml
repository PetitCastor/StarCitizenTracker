name: Release

on:
  push:
    # [0-9]*.[0-9]*.[0-9]* rather than bare v*: MinVer can't parse v*, vNext, v1.0, etc. and falls
    # back to 0.0.0-alpha.0 — a version that would then get packed and pushed to nuget.org, where it
    # can never be deleted, only unlisted. Tightened to what MinVer actually accepts.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    environment: nuget-release
    permissions:
      id-token: write # mints the OIDC token — without it NuGet/login fails
      contents: write # gh release create; a permissions block zeroes all unlisted scopes, so this
                       # must be spelled out even though it was the workflow default before.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Unshallow, and specifically for the tags: MinVer derives the version from the pushed
          # tag itself now (the trigger IS the tag), but it still walks history to confirm there is
          # nothing beyond it — a depth-1 clone carries no tags at all and MinVer falls back to
          # 0.0.0-alpha.0.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Full suite, same as ci.yml — the tag push is not itself proof the suite is green (a tag can
      # be pushed from any commit), so release re-verifies rather than trusting the CI run that may
      # have happened on a different ref.
      - name: Restore
        run: dotnet restore GameCapture.slnx

      - name: Build
        run: dotnet build GameCapture.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GameCapture.slnx --no-build -c Release --verbosity normal

      - name: Pack
        run: dotnet pack GameCapture.slnx --no-build -c Release -o packages

      # MinVerVersionOverride is gone: unlike the old auto-increment trigger, the tag this release is
      # named for already exists (it's what triggered the run), so MinVer reads it directly off
      # history without help.
      - name: Publish GameCapture.Engine
        run: dotnet publish src/GameCapture.Engine -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish/engine

      - name: Archive GameCapture.Engine
        run: Compress-Archive publish/engine/* GameCapture.Engine-${{ github.ref_name }}-win-x64.zip

      # GitHub release created BEFORE the NuGet push, and named explicitly rather than via a glob:
      # windows-latest's default shell is pwsh, and pwsh does not glob-expand arguments to native
      # executables (only cmdlet parameters) — `GameCapture.Engine-*.zip` reaches `gh` as that
      # literal string, `gh` does not glob either, and every run that tried it failed here. The name
      # was already computed to build the archive above, so reusing it can't drift.
      # Ordered ahead of the NuGet steps on purpose: TASK-17 doesn't wire a real trusted-publishing
      # policy (that's TASK-22, since policies are per-repository and this mono-repo isn't the repo
      # that survives), so the NuGet steps below will fail OIDC exchange for any tag pushed before
      # then. Putting the GitHub release first means that failure doesn't also cost the release.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} "GameCapture.Engine-${{ github.ref_name }}-win-x64.zip" --generate-notes

      # OIDC → short-lived API key, scoped to this job only. No NUGET_API_KEY secret exists anywhere
      # in this repo: nothing long-lived to rotate or leak.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Kept as its own push rather than relying on the main push's automatic co-located-snupkg
      # pickup, so a `.snupkg` sitting anywhere `packages/*.nupkg` doesn't literally match (a future
      # output-layout change, a partial `dotnet pack` re-run) still ships. --skip-duplicate makes the
      # common case — the main push already uploaded it — a no-op 409, not a failure.
      - name: Push symbol packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.snupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
