name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Whole solution in one shot: the wire contract (protoc codegen included, the most breakable
      # part), the engine, both plugins and all five test projects. A green CI that skipped any of
      # them would be merging a split that no longer joins back up.
      - name: Restore
        run: dotnet restore StarCitizenTracker.slnx

      - name: Build
        run: dotnet build StarCitizenTracker.slnx --no-restore -c Release

      - name: Test
        run: dotnet test StarCitizenTracker.slnx --no-build -c Release --verbosity normal
