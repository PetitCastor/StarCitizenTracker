name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Unshallow, and specifically for the tags: MinVer derives the version from the height
          # above the latest v* tag, and checkout's default depth-1 clone carries no tags at all.
          # Without this the whole build silently versions itself 0.0.0-alpha.0 — packages, the
          # engine's reported engine_version, everything — and nothing fails to say so.
          # EngineVersionTests is the guard that turns that into a red build.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Whole solution in one shot: the wire contract (protoc codegen included, the most breakable
      # part), the engine, both plugins and all five test projects. A green CI that skipped any of
      # them would be merging a split that no longer joins back up.
      - name: Restore
        run: dotnet restore GameCapture.slnx

      - name: Build
        run: dotnet build GameCapture.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GameCapture.slnx --no-build -c Release --verbosity normal

      # A plugin owns parsing and nothing else: its code must not name a transport type (Grpc,
      # RpcException), the wire proto namespace, or the engine assembly. `dotnet build` cannot catch a
      # re-coupling — a plugin that added `using Grpc.Core;` still compiles — so this greps the plugin
      # SOURCES (.cs only: the engine pipe name legitimately appears as a string in config.json) for
      # the forbidden references. rg exits 0 when it finds a hit and 1 when it finds none, so a hit is
      # the failure: report it and exit 1, otherwise let the clean (rg-1) run pass.
      - name: Plugin boundary grep gate
        shell: bash
        run: |
          if rg -n -g '*.cs' "using Grpc|RpcException|GameCapture\.Contracts\.Proto|GameCapture\.Engine" src/Plugins/; then
            echo "::error::Plugin boundary violation — a plugin references an engine/transport internal (listed above)."
            exit 1
          fi
          echo "Plugin boundary clean: no engine/transport references under src/Plugins/."

  # The wire contract is the one thing in this repo that two separately-shipped processes both
  # depend on, and `dotnet build` cannot see a break in it: regenerating C# from a proto that
  # dropped a field succeeds, and the plugin built against the old field only fails once it is
  # running against the new engine. buf compares the PR's protos against master and fails on a
  # wire- or JSON-incompatible change. Ubuntu because buf only reads .proto files — nothing here
  # touches the Windows-only capture stack.
  proto-guard:
    name: Proto Lint & Breaking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Unshallow: `breaking_against` resolves master out of the local .git, which a depth-1
          # clone does not contain.
          fetch-depth: 0

      # checkout leaves a PR build on the merge commit with no local `master` — buf clones the
      # local .git and looks for refs/heads/master, so without this the comparison fails with
      # "couldn't find remote ref master" rather than passing. Skipped on a push to master, where
      # the ref is already checked out and fetching into the current branch is refused by git.
      - name: Fetch master (breaking-change baseline)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/master:refs/heads/master

      - name: Lint & breaking-change check
        # Action pinned to a commit SHA, not the floating v1 tag: the `version:` pin below only
        # freezes the buf CLI, while a new v1.x action release can still re-default an input (the
        # push/archive defaults noted below are the action's, not the CLI's) and turn a PR that
        # changed nothing red. Both halves have to be frozen for the gate to be deterministic.
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          # Pinned rather than floating: a buf release that adds a lint rule would otherwise turn a
          # green PR red without a change to this repo. Bump it deliberately.
          version: 1.72.0
          lint: true
          # Only a PR has a baseline to compare against; on a push to master the comparison would
          # be master against itself.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ".git#branch=master"
          # Off deliberately. `buf format` would strip the aligned trailing comments capture.proto
          # uses to document the coordinate space of every rect field, collapse the one-line
          # messages, and rewrite the file to LF — a formatting opinion applied to the one file in
          # the repo whose diffs most need to stay readable. Lint and breaking are the gates that
          # protect consumers; formatting is not.
          format: false
          # Nothing to publish — this repo has no BSR module, and the action's push/archive steps
          # (both of which default to ON for the events this workflow runs on) would fail looking
          # for credentials that do not exist.
          push: false
          archive: false
          # The failing step's log is the report. A PR comment needs pull-requests: write on the
          # default token, which this workflow does not grant.
          pr_comment: false
