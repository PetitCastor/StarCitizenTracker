name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Whole solution, not just the monolith's test project: CaptureContracts carries the wire
      # contract (protoc codegen included, the most breakable part) and the parity tests that
      # detect drift between the transitional duplicates. Neither is worth anything if a green
      # CI can merge without compiling them.
      - name: Restore
        run: dotnet restore StarCitizenTracker.slnx

      - name: Build
        run: dotnet build StarCitizenTracker.slnx --no-restore -c Release

      - name: Test
        run: dotnet test StarCitizenTracker.slnx --no-build -c Release --verbosity normal
