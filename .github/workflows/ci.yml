name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/TrackingService.Tests/TrackingService.Tests.csproj

      - name: Build
        run: dotnet build tests/TrackingService.Tests/TrackingService.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/TrackingService.Tests/TrackingService.Tests.csproj --no-build -c Release --verbosity normal
